[package]
name = "yaspar-ir"
version = "2.7.8"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
description = "This crate provides a few representations of SMT scripts and other functionalities."
authors = ["the Amazon Trusted Solver team"]
keywords = ["SMT", "solver", "logic"]
categories = ["science"]
homepage = "https://github.com/yaspar-org/yaspar-ir"
repository = "https://github.com/yaspar-org/yaspar-ir"
exclude = ["tests/resources", "tests/regression.rs", ".github", "regression"]

[features]
default = ["none"]
all = ["cnf", "cache", "implicant-generation", "finite-set", "no-pattern"]
cnf = ["dep:sat-interface", "cache"]
implicant-generation = ["cnf"]
# cvc5 1.3.x through cvc5-rs 0.5 (the `cvc5` dependency)
"cvc5-parser-1.3.x" = ["cvc5?/parser"]
"cvc5-1.3.x" = ["cvc5-dep-1.3.x", "cvc5?/static"]
"cvc5-dep-1.3.x" = ["dep:cvc5"]
"cvc5-dynamic-1.3.x" = ["cvc5-dep-1.3.x"]
# cvc5 1.4.x through cvc5-rs 0.6 (the `cvc5-14` dependency)
"cvc5-parser-1.4.x" = ["cvc5-14?/parser"]
"cvc5-1.4.x" = ["cvc5-dep-1.4.x", "cvc5-14?/static"]
"cvc5-dep-1.4.x" = ["dep:cvc5-14"]
"cvc5-dynamic-1.4.x" = ["cvc5-dep-1.4.x"]
# the unversioned features select cvc5 1.4.x
cvc5-parser = ["cvc5-parser-1.4.x"]
cvc5 = ["cvc5-1.4.x"]
cvc5-dep = ["cvc5-dep-1.4.x"]
cvc5-dynamic = ["cvc5-dynamic-1.4.x"]
finite-set = []
atslib = ["finite-set"]
cache = []
none = []
# Parse the non-standard `:no-pattern` attribute; forwards to `yaspar/no-pattern`.
no-pattern = ["yaspar/no-pattern"]
regression = ["all", "cvc5"]

[dependencies]
yaspar = "2.7.2"
sat-interface = { version = "0.1", optional = true }
cvc5 = { version = "0.5.1", optional = true }
cvc5-14 = { package = "cvc5", version = "0.6.1", optional = true }
dashu = { version = "0.4.2", features = ["serde", "num-traits", "num-order"] }
hashconsing = "1.8"
rustc-hash = "2"
paste = "1"
lazy_static = "1.5.0"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
lalrpop-util = "0.22"
either = "1.15"
num-traits = "0.2.19"
num-order = "1.2.0"
delegate = "0.13"
bimap = "0.6"
yaspar-macros = "0.1.4"
yaspar-macros-defs = "0.1.4"

[lib]
name = "yaspar_ir"
path = "src/lib.rs"
crate-type = ["lib"]

[package.metadata.docs.rs]
features = ["all", "cvc5"]

[dev-dependencies]
serde_json = "1"
dashu = { version = "0.4.2", features = ["serde", "num-traits", "num-order"] }
